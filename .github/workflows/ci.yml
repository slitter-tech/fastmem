name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Тесты на Windows: без C и с C
  test-windows:
    name: Windows / Python ${{ matrix.python }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2019, windows-2022, windows-2025]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-2022
            arch: x64
        exclude:
          - os: windows-2019
            python: "3.13"
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch || 'x64' }}

      - name: Установить зависимости
        run: python -m pip install --upgrade pip

      # Расширение необязательно, но на Windows собирается: MSVC есть
      # в образе GitHub Actions. При неудаче сборки тесты всё равно идут.
      - name: Собрать C-расширение
        continue-on-error: true
        run: python setup.py build_ext --inplace

      - name: Показать активный backend
        run: python -c "from fastmem import backend; print('backend:', backend.backend_name())"

      - name: Тесты
        run: python -m tests.test_fastmem

      - name: Тесты без C-расширения (проверка fallback)
        shell: pwsh
        run: |
          $pyd = Get-ChildItem src\fastmem -Filter *.pyd -ErrorAction SilentlyContinue
          foreach ($f in $pyd) { Rename-Item $f.FullName "$($f.FullName).off" }
          python -c "from fastmem import backend; assert not backend.HAVE_C, backend.backend_name(); print('fallback активен')"
          python -m tests.test_fastmem
          foreach ($f in Get-ChildItem src\fastmem -Filter *.pyd.off -ErrorAction SilentlyContinue) {
            Rename-Item $f.FullName ($f.FullName -replace '\.off$','')
          }

  # Сборка wheel-ов для PyPI. Только Windows: пакет под Windows.
  build-wheels:
    name: Сборка wheels
    needs: test-windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Собрать wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Проверить содержимое wheel
        run: |
          python -c "import zipfile,glob; w=glob.glob('dist/*.whl')[0]; print(w); print('\n'.join(sorted(zipfile.ZipFile(w).namelist())))"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  # Проверка пакета без расширения: sdist -> установка -> тесты.
  # Гарантирует, что pip install без компилятора не ломается.
  test-sdist:
    name: Установка из sdist
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Установить в чистое окружение
        run: |
          python -m venv .venv-test
          .\.venv-test\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-test\Scripts\python.exe -m pip install dist\*.tar.gz

      - name: Тесты в чистом окружении
        run: |
          .\.venv-test\Scripts\python.exe -c "from fastmem import backend; print('backend:', backend.backend_name())"
          Copy-Item tests -Destination .\.venv-test\lib\site-packages\ -Recurse -Force
          .\.venv-test\Scripts\python.exe -m tests.test_fastmem
