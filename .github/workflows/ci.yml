name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows test matrix: every job runs the suite twice, with and without
  # the C extension, so the fallback path is covered on each interpreter.
  test-windows:
    name: Windows / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2019 is gone from the hosted runner images: jobs naming it
        # never start and sit queued forever. Server 2019 support therefore
        # cannot be verified here and rests on the fact that nothing in the
        # code uses an API newer than Server 2008.
        os: [windows-2022, windows-2025]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Python 3.9 is not published for windows-2025
          - os: windows-2025
            python: "3.9"
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      # The editable install builds the extension in place. The build is
      # optional by design, so a missing compiler must not fail the job:
      # setup.py swallows compiler errors and the package installs on pure
      # Python, which the fallback step below then exercises.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Report backend
        run: python -c "from fastmem import backend; print('backend:', backend.backend_name())"

      - name: Tests
        run: python -m tests.test_fastmem

      - name: Tests without the C extension
        run: |
          $pyd = Get-ChildItem src\fastmem -Filter *.pyd -ErrorAction SilentlyContinue
          foreach ($f in $pyd) { Rename-Item $f.FullName "$($f.FullName).off" }
          python -c "from fastmem import backend; assert not backend.HAVE_C, backend.backend_name(); print('fallback active')"
          python -m tests.test_fastmem
          foreach ($f in Get-ChildItem src\fastmem -Filter *.pyd.off -ErrorAction SilentlyContinue) {
            Rename-Item $f.FullName ($f.FullName -replace '\.off$','')
          }

  # Wheels for PyPI, built on GitHub for every supported Python and
  # architecture. This is the whole point: a user installs a wheel and
  # never needs MSVC, the Windows SDK or a compiler. x86 and ARM64 are
  # cross-compiled from the x64 runner, which is why setup.py reads the
  # target architecture from FASTMEM_BUILD_ARCH rather than assuming the
  # host.
  build-wheels:
    name: Wheels ${{ matrix.arch }}
    needs: test-windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cibw_archs: AMD64
          - arch: x86
            cibw_archs: x86
          - arch: arm64
            cibw_archs: ARM64
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels with cibuildwheel
        env:
          FASTMEM_BUILD_ARCH: ${{ matrix.arch }}
        run: |
          python -m pip install --upgrade pip cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse --archs ${{ matrix.cibw_archs }}

      - name: List wheels
        run: Get-ChildItem wheelhouse | Select-Object Name, Length | Format-Table -AutoSize

      # Guards against a silent regression to the optional build: a wheel
      # with no .pyd would install everywhere and simply be slow.
      - name: Every wheel must contain the extension
        run: |
          python -c @"
          import glob, sys, zipfile
          wheels = glob.glob('wheelhouse/*.whl')
          if not wheels:
              sys.exit('no wheels were produced')
          bad = []
          for w in wheels:
              names = zipfile.ZipFile(w).namelist()
              if not any(n.endswith('.pyd') for n in names):
                  bad.append(w)
          print('\n'.join(sorted(w.split('/')[-1] for w in wheels)))
          if bad:
              sys.exit('no C extension in: ' + ', '.join(bad))
          print('all wheels carry the compiled extension')
          "@

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl

  # The standalone C library and the header-only C++ wrapper. They ship
  # outside the wheel, so nothing else in this workflow would notice if
  # they stopped compiling.
  native:
    name: C and C++ build
    needs: test-windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # /W4 /WX is set inside the build script, so a new warning fails the
      # job rather than scrolling past.
      - name: Build the C library and the C++ example
        run: python tools/build_native.py --example

      - name: Run the example against this process
        run: |
          $env:PATH = "$PWD\build\native;$env:PATH"
          .\build\native\quickstart.exe

      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: |
            build/native/fastmem.dll
            build/native/fastmem.lib
            build/native/quickstart.exe

  # sdist -> clean venv -> tests. Guarantees that installing without a
  # compiler works, which is what most pip users on Windows hit.
  test-sdist:
    name: Install from sdist
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist
          Get-ChildItem dist

      - name: Install into a clean environment
        run: |
          python -m venv .venv-test
          $py = ".\.venv-test\Scripts\python.exe"
          & $py -m pip install --upgrade pip
          # The glob has to be resolved by PowerShell. Passed as a literal
          # argument, pip sees "dist\*.tar.gz" and fails with
          # OSError: [Errno 22] Invalid argument.
          $sdist = (Get-ChildItem dist\*.tar.gz).FullName
          Write-Output "installing $sdist"
          & $py -m pip install $sdist

      - name: Tests in the clean environment
        run: |
          $py = ".\.venv-test\Scripts\python.exe"
          & $py -c "from fastmem import backend; print('backend:', backend.backend_name())"
          Copy-Item tests -Destination .\.venv-test\lib\site-packages\ -Recurse -Force
          & $py -m tests.test_fastmem