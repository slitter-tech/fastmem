name: Publish to PyPI

# Triggered by a v* tag: both the build and the upload. Keying off
# release:published would mean creating a GitHub Release by hand first,
# and a tag is simpler: git tag + git push and everything runs.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build wheel + sdist
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check tag against package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG version=$VER"
          test "$TAG" = "v$VER" || { echo "tag $TAG does not match version $VER"; exit 1; }

      - name: Show contents
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          python -c "import zipfile,glob;w=glob.glob('dist/*.whl')[0];print('\n'.join(sorted(zipfile.ZipFile(w).namelist())))"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastmem
    permissions:
      id-token: write          # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # skip-existing allows re-running a tag that already uploaded.
          skip-existing: true

  github-release:
    name: Release notes
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Skipped when the upload failed: never create a release whose
    # packages cannot be downloaded.
    if: always() && needs.publish.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Extract section from CHANGELOG
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG="${TAG:-$(git describe --tags --abbrev=0)}"
          python - "$TAG" <<'EOF' > notes.md
          import re, sys
          tag = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # take everything from "## [tag]" up to the next "## ["
          m = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## \[|\Z)" % re.escape(tag),
                        text, re.S | re.M)
          print(m.group(1).strip() if m else "See CHANGELOG.md")
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md