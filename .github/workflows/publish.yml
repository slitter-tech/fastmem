name: Publish to PyPI

# Triggered by a v* tag: both the build and the upload. Keying off
# release:published would mean creating a GitHub Release by hand first,
# and a tag is simpler: git tag + git push and everything runs.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build wheels + sdist
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cibw_archs: AMD64
          - arch: x86
            cibw_archs: x86
          - arch: arm64
            cibw_archs: ARM64
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag against package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG version=$VER"
          test "$TAG" = "v$VER" || { echo "tag $TAG does not match version $VER"; exit 1; }

      # Same matrix as CI, so what is published is exactly what was tested.
      - name: Build wheels with cibuildwheel
        env:
          FASTMEM_BUILD_ARCH: ${{ matrix.arch }}
        run: |
          python -m pip install --upgrade pip cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse --archs ${{ matrix.cibw_archs }}

      # The sdist is the fallback for platforms no wheel covers. Built in
      # only one matrix leg, otherwise it would be uploaded three times
      # under the same filename.
      - name: Build sdist
        if: matrix.arch == 'x64'
        run: python -m build --sdist --outdir wheelhouse

      - name: List artifacts
        run: Get-ChildItem wheelhouse | Select-Object Name, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: wheelhouse/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastmem
    permissions:
      id-token: write          # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List what will be uploaded
        run: ls -l dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # skip-existing allows re-running a tag that already uploaded.
          skip-existing: true

  github-release:
    name: Release notes
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Skipped when the upload failed: never create a release whose
    # packages cannot be downloaded.
    if: always() && needs.publish.result == 'success'
    steps:
      # Needed so CHANGELOG.md is present in the workspace and git describe
      # has the full history to find the latest tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Extract section from CHANGELOG
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG="${TAG:-$(git describe --tags --abbrev=0)}"
          # CHANGELOG uses "## [0.1.0]" without the leading "v".
          TAG="${TAG#v}"
          python - "$TAG" <<'EOF' > notes.md
          import re, sys
          tag = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # take everything from "## [tag]" up to the next "## ["
          m = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## \[|\Z)" % re.escape(tag),
                        text, re.S | re.M)
          print(m.group(1).strip() if m else "See CHANGELOG.md")
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md