[build-system]
# setuptools rather than hatchling: the C extension has to be compiled and
# hatchling cannot do that, so pip install -e . would silently skip
# _fastmem. setuptools is pinned to >=64 for the license handling below.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmem"
version = "0.1.0"
description = "High-performance process memory reading for Windows (reverse engineering, debugging, forensics)"
readme = "README.md"
requires-python = ">=3.9"
# The licence is declared exactly once, as a plain PEP 621 string.
#   * license-files would be read by setuptools >= 77 as the PEP 639
#     spelling of this same key, which then trips "must be valid exactly
#     by one definition, 2 matches found" on the runner.
#   * a "License :: OSI Approved :: MIT License" classifier is rejected by
#     setuptools >= 77 as superseded ("License classifiers have been
#     superseded by license expressions").
# The plain string is the form both the old and the new setuptools accept.
# LICENSE itself still ships in the sdist through MANIFEST.in.
license = "MIT"
authors = [{ name = "wh1letr0e" }]
keywords = [
    "windows",
    "memory",
    "read-process-memory",
    "reverse-engineering",
    "debugging",
    "forensics",
    "process",
    "ctypes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 7",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/slitter-tech/fastmem"
Repository = "https://github.com/slitter-tech/fastmem"
Issues = "https://github.com/slitter-tech/fastmem/issues"
Changelog = "https://github.com/slitter-tech/fastmem/blob/main/CHANGELOG.md"

[tool.setuptools]
# The C extension is declared in setup.py; here only the package layout.
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastmem = ["*.c", "*.pyd"]
